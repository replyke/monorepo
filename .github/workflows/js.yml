# js group (@sublay/js — the framework-agnostic, user-token SDK).
#
# Replaces the standalone test.yml that js-sdk ran in its own repo. Same
# shape as the node job: jest via ts-jest compiles src/ and __tests__/
# in-process against tsconfig.jest.json, every test imports through a
# relative ../src/ path, and the package has no workspace dependencies —
# so nothing in the run reads dist/ and no build step is needed. Verified
# by running the suite with no dist/ present anywhere in the workspace
# (553 tests, all passing).
#
# See .github/workflows/test.yml for why each group gets its own workflow
# file instead of a job in a shared one.
name: Test js

on:
  pull_request:
    paths:
      - "packages/js/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "playground/package.json"
      - "tsconfig.json"
      - ".github/workflows/js.yml"
  push:
    branches:
      - main
    paths:
      - "packages/js/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "playground/package.json"
      - "tsconfig.json"
      - ".github/workflows/js.yml"

jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        # --ignore-scripts so this job doesn't build the other five
        # workspace packages that declare a `prepare` script, and doesn't
        # build this one either — see the note above on why nothing here
        # reads dist/. Full reasoning in .github/workflows/test.yml.
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run js test suite
        run: pnpm --filter @sublay/js run test
