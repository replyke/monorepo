# node group (@sublay/node — the server-side, service-key SDK).
#
# Replaces the standalone test.yml that node-sdk ran in its own repo. The
# suite is jest via ts-jest, which compiles src/ and __tests__/ in-process
# against tsconfig.jest.json, and every test imports through a relative
# ../src/ path — so the *tests* need no dist/ (verified by running the
# suite with no dist/ present anywhere in the workspace: 445 tests, all
# passing), and the package has no workspace dependencies whose dist it
# could need either.
#
# Both of the package's compile steps run below, because "the tests don't
# read dist/" is not the same as "the build needs no coverage". Before
# every install started passing --ignore-scripts, the package's `prepare`
# hook (`pnpm build && pnpm build:types`) ran both as an incidental side
# effect of `pnpm install` — that was this package's only compile coverage
# in CI, so replacing it takes both halves, not one:
#
#   * `build` (tsup --dts) type-checks the public surface on the way to
#     emitting declarations — but only the module graph reachable from
#     src/index.ts.
#   * `build:types` (tsc --emitDeclarationOnly) compiles the whole `src`
#     program. That is the only thing covering source files the barrel
#     never reaches: six of them today (src/interfaces/Project.ts and the
#     five src/modules/oauth/* files). Verified by putting a type error in
#     src/interfaces/Project.ts — `build` succeeds and all 445 tests pass,
#     while `build:types` fails with TS2322. A `build`-only step would let
#     that ship.
#
# See .github/workflows/test.yml for why each group gets its own workflow
# file instead of a job in a shared one.
name: Test node

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "packages/node/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "playground/package.json"
      - "tsconfig.json"
      - ".github/workflows/node.yml"
  push:
    branches:
      - main
    paths:
      - "packages/node/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "playground/package.json"
      - "tsconfig.json"
      - ".github/workflows/node.yml"

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        # --ignore-scripts so this job doesn't build the other five
        # workspace packages that declare a `prepare` script. This package
        # is built explicitly in the next step instead. Full reasoning in
        # .github/workflows/test.yml.
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build node
        # Not needed by the test step (see the note at the top of this
        # file), but the build is a real check in its own right: it
        # type-checks the declaration emit for the public surface.
        run: pnpm --filter @sublay/node run build

      - name: Typecheck node declaration emit
        # The other half of what `prepare` used to run. `build` above only
        # sees what src/index.ts reaches; this compiles the whole src
        # program, and is the only coverage for the six source files
        # outside that graph. See the note at the top of this file.
        run: pnpm --filter @sublay/node run build:types

      - name: Run node test suite
        run: pnpm --filter @sublay/node run test
