# node group (@sublay/node — the server-side, service-key SDK).
#
# Replaces the standalone test.yml that node-sdk ran in its own repo. The
# suite is jest via ts-jest, which compiles src/ and __tests__/ in-process
# against tsconfig.jest.json, and every test imports through a relative
# ../src/ path — nothing in the run reads dist/, and the package has no
# workspace dependencies whose dist it could need either. So there is
# deliberately no build step: verified by running the suite with no dist/
# present anywhere in the workspace (445 tests, all passing).
#
# See .github/workflows/test.yml for why each group gets its own workflow
# file instead of a job in a shared one.
name: Test node

on:
  pull_request:
    paths:
      - "packages/node/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "playground/package.json"
      - "tsconfig.json"
      - ".github/workflows/node.yml"
  push:
    branches:
      - main
    paths:
      - "packages/node/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "playground/package.json"
      - "tsconfig.json"
      - ".github/workflows/node.yml"

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        # --ignore-scripts so this job doesn't build the other five
        # workspace packages that declare a `prepare` script, and doesn't
        # build this one either — see the note above on why nothing here
        # reads dist/. Full reasoning in .github/workflows/test.yml.
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run node test suite
        run: pnpm --filter @sublay/node run test
