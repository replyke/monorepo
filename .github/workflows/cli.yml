# cli group (@sublay/cli + the registry it installs from).
#
# registry/ is watched alongside packages/cli/ because the two are one
# product: the CLI's fetchFile() downloads whatever registry/**/registry.json
# says it should, so a registry-only change can break `sublay add` without
# the CLI source moving at all — and because the registry is served straight
# off this branch, it breaks for every user the moment it merges. Building the
# CLI can't see that, so the integrity step below checks the registry metadata
# itself: every registryUrl points at its own directory, every files[].path
# exists on disk, and exports.mainFile names one of them. .github/scripts/** is
# watched too, since that check is the only consumer of those scripts and a
# PR editing one of them would otherwise run no CI at all.
#
# playground/ is watched and built here too: it is the cli group's dev
# harness, and since it now resolves @sublay/react-js and
# @sublay/ui-core-react-js through workspace:* links rather than from npm,
# a breaking change in either compiles straight into it. `playground build`
# runs `tsc && vite build`, so that break surfaces here instead of the next
# time a human opens the harness by hand. (playground/package.json is also
# watched by every other workflow, for a different reason: it is a
# workspace member feeding the single shared pnpm-lock.yaml.)
#
# registry/ is typechecked too. It used to be exempt, on the stated grounds
# that the tailwind templates import `cn` from @/lib/utils — an alias said
# to resolve only inside a real consumer project. That was wrong: every one
# of the 13 errors was the same TS2307 for that single module, and
# registry/tsconfig.json's `@/*` -> `./*` mapping already pointed at a
# resolvable location. registry/lib/utils.ts now provides the same `cn`
# a consumer project's own lib/utils.ts does (built from clsx +
# tailwind-merge, both already registry devDependencies), so all 182
# template files compile. No registry.json lists that file, so `sublay add`
# never copies it and it changes nothing about what users install.
#
# Read that gate for what it is, though: registry/ links @sublay/core,
# react-js, react-native, expo and both ui-core packages through
# `workspace:*`, so the templates compile against this branch's LOCAL,
# unreleased source — not against the published npm versions a real
# consumer resolves when `sublay add` drops these files into their project.
# A green registry typecheck therefore means "these templates compile
# against current local source", not "these templates are verified against
# what ships to users". The two diverge for as long as any SDK change sits
# unreleased, and nothing in CI closes that gap today.
#
# packages/cli's own `typecheck` runs here too. It used to be exempt on the
# same shape of false premise as registry/: the claim was that three
# untyped @babel/* imports in src/utils/strip-types.ts made it impossible.
# They were three real TS7016 errors in live, shipped code —
# src/index.ts -> commands/add.ts -> utils/strip-types.ts, bundled straight
# into dist/index.js — not dead weight, and `tsup --dts` exits 0 on them
# because it does not fully type-check. Fixed by adding the
# @types/babel__core devDependency plus ambient `declare module` shims for
# @babel/preset-typescript and @babel/plugin-syntax-jsx (neither has an
# @types package) in src/types/babel-shims.d.ts. The script now exits 0
# with zero errors, so it is a real gate.
#
# Both the registry typecheck and the playground build compile against
# locally-built dist/, not npm — which is why packages/core/**,
# packages/react-js/**, packages/react-native/**, packages/expo/**,
# packages/ui-core-react-js/** and packages/ui-core-react-native/** are all
# in the path filters below. registry/ imports all six through workspace:*
# links and playground imports three of them, so a PR touching only one of
# those packages can break this group's compile; without those filters this
# workflow would never run for exactly the changes those two steps exist to
# catch. That is a deliberate, documented widening of per-group isolation:
# registry/ and playground/ genuinely consume the react-family and ui-core
# packages, so their CI has to react to them.
#
# See .github/workflows/test.yml for why each group gets its own workflow
# file instead of a job in a shared one.
name: Test cli

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "packages/cli/**"
      - "packages/core/**"
      - "packages/react-js/**"
      - "packages/react-native/**"
      - "packages/expo/**"
      - "packages/ui-core-react-js/**"
      - "packages/ui-core-react-native/**"
      - "registry/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "playground/**"
      - "tsconfig.json"
      - ".github/scripts/**"
      - ".github/workflows/cli.yml"
  push:
    branches:
      - main
    paths:
      - "packages/cli/**"
      - "packages/core/**"
      - "packages/react-js/**"
      - "packages/react-native/**"
      - "packages/expo/**"
      - "packages/ui-core-react-js/**"
      - "packages/ui-core-react-native/**"
      - "registry/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "playground/**"
      - "tsconfig.json"
      - ".github/scripts/**"
      - ".github/workflows/cli.yml"

jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Runs before install/build on purpose: it is a pure JSON + filesystem
      # check on Node built-ins, it needs no dependencies and no build output,
      # and a broken registry is the failure mode this job exists to catch.
      - name: Check registry integrity
        run: node .github/scripts/check-registry-integrity.mjs

      - name: Install dependencies
        # --ignore-scripts so this job doesn't build the six workspace
        # packages that declare a `prepare` script — none of which is
        # @sublay/cli, and a break in any of them used to fail this install
        # step on a cli-only PR. See .github/workflows/test.yml for the full
        # reasoning and for why it is safe for esbuild/@swc/core (which
        # tsup, below, depends on).
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build cli
        # The cli uses `prepublishOnly`, not `prepare`, so install never
        # built it. This step is the only thing that compiles it, and with
        # no test suite yet it is the only thing that checks it at all.
        run: pnpm --filter @sublay/cli run build

      - name: Build packages registry and playground consume
        # --ignore-scripts skipped these packages' `prepare` hooks, but both
        # registry/ and playground/ link them through workspace:* and read
        # their dist/ type entries (every one declares
        # "types": "dist/esm/index.d.ts"), so the next two steps cannot
        # compile without them. registry/ imports all six; playground imports
        # core, react-js and ui-core-react-js. core builds first because the
        # other five reach into its types. This does mean a genuinely broken
        # react-family or ui-core build can redden this job — a narrow,
        # deliberate exception to per-group isolation, matching the path
        # filters above.
        run: |
          pnpm --filter @sublay/core run build
          pnpm --filter @sublay/react-js --filter @sublay/react-native --filter @sublay/expo --filter @sublay/ui-core-react-js --filter @sublay/ui-core-react-native run build

      - name: Typecheck registry
        # `tsc --noEmit` over all 182 component templates. The templates are
        # authored source that is copied verbatim into user projects by
        # `sublay add` and never compiled anywhere else in this repo, so
        # without this step a template that does not typecheck ships to
        # every user and only fails in their build. See this file's header
        # for why this was previously (wrongly) believed to be impossible.
        run: pnpm --filter @sublay/registry run typecheck

      - name: Build playground
        # playground is this group's dev harness and resolves
        # @sublay/react-js + @sublay/ui-core-react-js through workspace:*
        # links, so its `tsc && vite build` is a real compile against local
        # source — the only thing in CI that checks the harness still
        # builds.
        run: pnpm --filter @sublay/playground run build

      - name: Typecheck cli
        # `tsc --noEmit` over packages/cli/src. This is not redundant with
        # the build above: `tsup --dts` exits 0 on code tsc rejects — it
        # only type-checks as far as the declaration emit needs, and the
        # three untyped @babel/* imports in src/utils/strip-types.ts sat in
        # the shipped dist/index.js bundle for exactly that reason. See
        # this file's header for why this was previously (wrongly) believed
        # to be impossible.
        run: pnpm --filter @sublay/cli run typecheck

      - name: Run cli test suites
        # No suites exist yet, so this is a no-op today and starts doing
        # real work the moment one lands.
        run: pnpm --filter @sublay/cli --if-present run test

      - name: Dry-run publish
        # Only @sublay/cli — `registry` and `playground` are private
        # workspace members and are never published.
        #
        # Nothing else in CI exercises the publish path; until now the only
        # thing that ever had was a human running this by hand. The step
        # performs the real publish minus the upload: pnpm runs the
        # package's `prepublishOnly` hook in a publish context, rewrites any
        # `workspace:*` dependency to a concrete version, and packs the
        # tarball `files` describes, failing on anything npm rejects along
        # the way.
        #
        # Scope it honestly — it is a packaging check, not a link check.
        # Verified: a `bin` naming a path the tarball does not contain still
        # dry-runs green, so this will NOT catch a broken entry-point path.
        # What it catches is a release that cannot be produced at all: a
        # publish-only lifecycle hook that fails, an unresolvable
        # `workspace:*`, a package.json npm refuses, a `files` set that
        # packs nothing.
        #
        # --force is load-bearing, not belt-and-braces: without it `pnpm
        # publish` skips any package whose version is already on npm and
        # exits 0 having packed nothing (verified). These workflows trigger
        # on file changes, not version bumps, so the un-forced form would be
        # an inert step on almost every run. --force only bypasses that skip;
        # --dry-run still stops before anything is uploaded, and needs no
        # registry credentials (verified with an empty npm config).
        run: pnpm --filter @sublay/cli publish --dry-run --no-git-checks --force
