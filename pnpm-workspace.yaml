packages:
  - "packages/**/*"
  # registry and playground live at the repo root, not under packages/, so
  # they need listing explicitly — the glob above will never reach them.
  # Both are private dev-only members of the cli group: registry holds the
  # component sources `sublay add` installs, playground is a manual Vite
  # harness for eyeballing them.
  - "registry"
  - "playground"
allowBuilds:
  '@firebase/util': true
  protobufjs: true
  # cli's own workspace opted esbuild in because it genuinely needs the
  # build (tsup for @sublay/cli, vite for playground). The monorepo had it
  # under ignoredBuiltDependencies instead, but only to stop pnpm failing
  # on an unapproved build script it had no consumer for — allowing it is
  # the union of the two intents, not a reversal of either.
  esbuild: true
  # Same reasoning as esbuild above: cli's toolchain (tsup/vite) needs its
  # build script to run; a clean install otherwise exits non-zero once pnpm
  # actually enforces ERR_PNPM_IGNORED_BUILDS for it (pnpm 10 only warns,
  # but this closes the gap for anyone on a newer pnpm).
  '@swc/core': true
minimumReleaseAgeExclude:
  # pnpm's install-delay guard would otherwise refuse @sublay releases that
  # are younger than the configured minimum age, which blocks the registry
  # and playground from consuming a package we just published ourselves.
  # No `minimumReleaseAge` is actually configured today, so this list is
  # inert until one is.
  #
  # Bare package names on purpose. pnpm parses each entry as either a name
  # (or name glob), which exempts every version of it, or `name@<exact
  # versions>` — and it really does mean exact: `@sublay/core@*` is not a
  # wildcard, it is rejected outright with ERR_PNPM_INVALID_MINIMUM_RELEASE_
  # AGE_EXCLUDE ("Use exact versions only"). A pinned version would also
  # have to track whatever pnpm-lock.yaml currently resolves — which is the
  # published version, NOT the workspace source version in each
  # package.json, a distinction that already went wrong here once: these
  # were pinned to 7.13.0 (the workspace version) while the lockfile
  # resolved 7.12.0, so the entries matched nothing and excluded nothing,
  # silently. Names never go stale.
  - '@sublay/ui-core-react-js'
  - '@sublay/ui-core-react-native'
  - '@sublay/core'
  - '@sublay/expo'
  - '@sublay/react-js'
  - '@sublay/react-native'
